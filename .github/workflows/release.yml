name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    uses: FreeSynergy/fs-release/.github/workflows/release.yml@main
    with:
      binaries: fs-tasks
      cargo-package: fs-tasks
      name: fs-tasks
      kind: app
      app-id: net.freesynergy.Tasks
      macos: false
      windows-targets: ""   # Unix sockets and Unix paths for now
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
