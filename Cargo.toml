[workspace]
resolver = "2"
members = ["crates/fs-tasks-core", "crates/fs-tasks-server", "crates/fs-tasks-app"]

[workspace.package]
version = "0.9.0"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-tasks"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

# Window resize crash (wgpu validation error when the window is enlarged); see fs-store/DESIGN.md.
[patch.crates-io]
blinc_app = { git = "https://github.com/FreeSynergy/blinc-app-fix" }
