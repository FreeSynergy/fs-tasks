[workspace]
resolver = "2"
members = [
    "crates/fs-tasks-core",
    "crates/fs-tasks-server",
    "crates/fs-tasks-client",
    "crates/fs-tasks-app",
]

[workspace.package]
version = "0.6.1-rc.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
authors = ["FreeSynergy contributors"]
repository = "https://github.com/FreeSynergy/fs-tasks"

# Window resize crash (wgpu validation error when the window is enlarged): compositor cache sized by the window,
# not by the target texture. Pinned to a commit (coding.md section 8).
[patch.crates-io]
blinc_app = { git = "https://github.com/FreeSynergy/blinc-app-fix", rev = "1c5d217c3b07872b1de8c7959fe44f07b344783c" }
