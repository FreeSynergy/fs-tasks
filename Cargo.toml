[workspace]
resolver = "2"
members = ["crates/fs-tasks-core", "crates/fs-tasks-server", "crates/fs-tasks-app", "crates/fs-tasks-cli", "crates/fs-tasks"]

[workspace.package]
version = "0.0.3"
authors = ["FreeSynergy <support@freesynergy.net>"]
repository = "https://github.com/FreeSynergy/fs-tasks"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

# Window resize crash (wgpu validation error when the window is enlarged); see fs-store/DESIGN.md.
[patch.crates-io]
blinc_app = { git = "https://github.com/FreeSynergy/blinc-app-fix", rev = "180398ccb0b6c031880689b945030c99337d8220" }
# Restyle only the nodes an incremental update replaced (blinc-layout-fix, same change as Blinc pull request 71).
blinc_layout = { git = "https://github.com/FreeSynergy/blinc-layout-fix", rev = "b1f340019271b826d81bffd0a9ee2e8b357a0e4c" }
