[package]
name = "fs-tasks-server"
description = "Cap'n Proto server of FreeSynergy tasks: the contract tasks.capnp over a Unix socket, in front of any TaskItems provider"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_tasks_server"

[dependencies]
fs-tasks-core = { path = "../fs-tasks-core", features = ["contract"] }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }
