[package]
name = "fs-tasks-server"
description = "Cap'n Proto server of FreeSynergy tasks: the contract tasks.capnp over a Unix socket, in front of any TaskItems provider"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_tasks_server"

[[bin]]
name = "fs-tasks-server"
path = "src/main.rs"

[dependencies]
fs-tasks-core = { path = "../fs-tasks-core", features = ["contract"] }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.18.0", features = ["rpc"] }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
capnp = "0.27"
capnp-rpc = "0.27"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
uuid = "1"
tokio = { version = "1", features = ["full"] }
