[package]
name = "fs-tasks-app"
description = "The tasks program of FreeSynergy, window: the generated Admin frontend over the type description of Task (ADR 0066), in the standard window shell (ADR 0065)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fs-tasks-core = { path = "../fs-tasks-core" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
# The type description the core reports (supported flag, Edit).
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11" }
# TEMPORARY: the tag fs-admin-frontend (rev 4688cee) is built on; see src/frontend_link.rs.
fs-types-frontend = { package = "fs-types", git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.2" }
# Exactly this commit of branch thread-a-admin-frontend (untagged, reviewed through its fifth review); every
# fs-components crate below comes from the same commit, otherwise there are two copies of AppWidget. Switch to the
# tag once Thread C/A tag. See DESIGN.md.
fs-admin-frontend = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-fields = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
fs-components-styles = { git = "https://github.com/FreeSynergy/fs-components", rev = "4688cee" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
