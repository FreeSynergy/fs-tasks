[package]
name = "fs-tasks-app"
description = "The tasks program of FreeSynergy, first window: list and status view of one set of tasks; search, create, edit, delete, move; iCalendar in and out; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fs-tasks-core = { path = "../fs-tasks-core" }
fs-tasks-client = { path = "../fs-tasks-client" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
# provisional: becomes a tag once reviewed
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", rev = "8c38a3b17f6b723ef625046a271c5564f5d7aa26" }
# provisional: becomes a tag once reviewed
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", rev = "8c38a3b17f6b723ef625046a271c5564f5d7aa26" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
fs-tasks-server = { path = "../fs-tasks-server" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.36.0", features = ["rpc"] }
tempfile = "3"
async-trait = "0.1"
# provisional: becomes a tag once reviewed
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", rev = "8c38a3b17f6b723ef625046a271c5564f5d7aa26" }

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/fs-tasks-app", dest = "/usr/bin/fs-tasks-app", mode = "755" },
]

[package.metadata.generate-rpm.requires]
fs-tasks-server = "*"
