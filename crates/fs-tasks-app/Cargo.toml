[package]
name = "fs-tasks-app"
description = "The tasks program of FreeSynergy, first window: list and status view of one set of tasks; search, create, edit, delete, move; iCalendar in and out; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The window writes what is typed into its fields to `FS_TEST_ACCESS_FILE` (fs-components `test-access`). ONLY for the
# typing test, in a debug build: fs-components refuses the feature in a release build (compile_error), and no release
# manifest of ours turns it on.
test-access = ["fs-components-app/test-access"]

[dependencies]
fs-tasks-core = { path = "../fs-tasks-core" }
fs-tasks-server = { path = "../fs-tasks-server" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.19", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
fs-components-app = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.13" }
fs-components-widgets = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.13" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.13" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
fs-components-render = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.13" }
