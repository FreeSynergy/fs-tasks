[package]
name = "fs-tasks-core"
description = "Program core of FreeSynergy tasks: JSCalendar 2.0 Task over fs-store behind the TaskItems interface, RFC 9253 relations, iCalendar VTODO"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Cap'n Proto contract: the schema and generated code live in fs-interfaces (ADR 0045).
contract = ["dep:capnp", "dep:fs-interfaces"]

[dependencies]
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
# Last MIT/Apache version before Stalwart moved later releases to AGPL: pinned exactly (see DESIGN.md).
calcard = "=0.3.14"
# Zones: jiff (Unlicense OR MIT) with the system tzdb preferred and a bundled copy as fallback (ADR 0026).
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
jiff-tzdb = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
capnp = { version = "0.27", optional = true }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.1.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
