[package]
name = "fs-tasks-client"
description = "Client of the tasks contract (tasks.capnp): TaskItems of fs-tasks-core over a Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fs-tasks-core = { path = "../fs-tasks-core", features = ["contract"] }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.36.0", features = ["rpc"] }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
capnp = "0.27"
serde_json = "1"
async-trait = "0.1"

[dev-dependencies]
fs-tasks-server = { path = "../fs-tasks-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
