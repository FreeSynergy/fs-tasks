[package]
name = "fs-tasks-cli"
description = "Command line of FreeSynergy tasks: a second user of tasks.capnp, next to the MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_tasks_cli"

[dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
fs-tasks-core = { path = "../fs-tasks-core", features = ["contract"] }
fs-tasks-server = { path = "../fs-tasks-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
